name: Quellcode-Pruefung

on:
  push:
    branches: [main, feat/deutsch-hermes-audio]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python-Syntax
        run: python -m compileall -q server.py commands.py runtime.py voice.py hermes_audio.py hermes_audio_worker.py
      - name: JavaScript-Syntax
        run: node --check ui/app.js
      - name: Deutsche Spracherkennung
        run: grep -F "recognition.lang = 'de-DE'" ui/app.js
      - name: Deutsche Oberflaeche
        run: grep -F '<html lang="de">' ui/index.html
